            if (kel) state.user.kelompokTani = kel;

            const container = document.getElementById('ob-lands-container');

                            </div>
                        </div>
                        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/10 text-white flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                    </div>

                    <div id="chat-messages-scroll" class="flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50">
                        ${state.chatMessages.map(msg => `
                            <div class="flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}">
                                <div class="max-w-[85%] p-3.5 rounded-2xl text-xs leading-relaxed ${msg.sender === 'user' ? 'bg-[#15803D] text-white rounded-tr-none shadow-sm' : 'bg-white text-gray-800 rounded-tl-none border border-gray-100 shadow-sm'}">
                                    ${msg.text}
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="p-3 bg-white border-t border-gray-100 flex items-center space-x-2 shrink-0">
                        <input type="text" id="chat-input" placeholder="${t.aiPlaceholder}" class="flex-1 px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-xs focus:ring-2 focus:ring-[#15803D] focus:outline-none">
                        <button onclick="sendChatMessage()" class="w-11 h-11 bg-[#15803D] text-white rounded-2xl flex items-center justify-center shrink-0 hover:bg-[#166534]"><i class="fa-solid fa-paper-plane text-xs"></i></button>
                    </div>
                </div>
            `;
            const scroll = document.getElementById('chat-messages-scroll');
            if (scroll) scroll.scrollTop = scroll.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if (!txt) return;

            state.chatMessages.push({ sender: 'user', text: txt });
            input.value = '';
            renderChatUI();

            setTimeout(() => {
                let reply = state.lang === 'id'
                    ? `Pak ${state.user.name}, berdasarkan analisis NusaTani: Kelayakan Modal Anda (${state.user.creditScoreValue}) siap diajukan via WhatsApp ke BUMDes/Bank Tani, Uji kadar air gabah aman dari potongan sepihak, dan prediksi harga menyarankan tahan stok 3 hari lagi.`
                    : `Pak ${state.user.name}, adhedhasar analisis NusaTani: Bijian Modal Sampeyan (${state.user.creditScoreValue}) siap diajokne liwat WhatsApp menyang BUMDes/Bank Tani, Uji banyu gabah aman saka suda timbangan, lan prediksi rega nyaranake simpen stok 3 dina maneh.`;
                state.chatMessages.push({ sender: 'ai', text: reply });
                renderChatUI();
            }, 800);
        }

        function closeModal() {
            const modal = document.getElementById('modal-container');
            modal.classList.add('hidden');
            modal.innerHTML = '';
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = "bg-[#14532D] text-white px-4 py-3 rounded-2xl shadow-xl text-xs font-semibold flex items-center space-x-2 animate-fadeIn pointer-events-auto border border-emerald-400/30";
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i><span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
